name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: ./gradlew assembleRelease
        env:
          KEYSTORE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - run: |
          cp app/build/outputs/apk/release/app-release.apk "lemonscented-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "lemonscented-$GITHUB_REF_NAME.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
